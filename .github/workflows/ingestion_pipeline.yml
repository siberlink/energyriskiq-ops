name: Ingestion Pipeline

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      skip_ai:
        description: 'Skip AI enrichment'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_risk:
        description: 'Skip risk scoring'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Do not serialize this workflow in GitHub. GitHub keeps only one pending run
# per concurrency group. The protected API endpoint owns overlap prevention.
jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      APP_URL: ${{ secrets.APP_URL }}
      INTERNAL_RUNNER_TOKEN: ${{ secrets.INTERNAL_RUNNER_TOKEN }}
      SKIP_AI: ${{ github.event.inputs.skip_ai || 'false' }}
      SKIP_RISK: ${{ github.event.inputs.skip_risk || 'false' }}

    steps:
      - name: Validate configuration
        run: |
          if [ -z "$APP_URL" ] || [ -z "$INTERNAL_RUNNER_TOKEN" ]; then
            echo "::error::APP_URL and INTERNAL_RUNNER_TOKEN must be configured"
            exit 1
          fi

      - name: Run protected ingestion pipeline
        id: pipeline
        run: |
          curl_exit=0
          response=$(curl --silent --show-error \
            --connect-timeout 10 --max-time 1500 \
            --get -w "\n%{http_code}" -X POST \
            "$APP_URL/internal/run/ingestion-pipeline" \
            --data-urlencode "skip_ai=$SKIP_AI" \
            --data-urlencode "skip_risk=$SKIP_RISK" \
            -H "X-Runner-Token: $INTERNAL_RUNNER_TOKEN" \
            -H "Content-Type: application/json") || curl_exit=$?

          if [ "$curl_exit" -ne 0 ]; then
            printf '{"error":"request_failed","curl_exit":%s}\n' "$curl_exit" |
              tee ingestion_output.txt
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          printf '%s\n' "$body" | tee ingestion_output.txt

          if [ "$http_code" = "409" ]; then
            echo "::notice::The protected ingestion pipeline is already active"
            echo "status=busy" >> "$GITHUB_OUTPUT"
          elif [ "$http_code" = "200" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Ingestion pipeline returned HTTP $http_code"
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload logs
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: ingestion-logs-${{ github.run_id }}
          path: ingestion_output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: always()
        env:
          PIPELINE_STATUS: ${{ steps.pipeline.outputs.status || steps.pipeline.outcome }}
          TRIGGER_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## Ingestion Pipeline Run Summary"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            printf '| Trigger | %s |\n' "$TRIGGER_NAME"
            printf '| Skip AI | %s |\n' "$SKIP_AI"
            printf '| Skip risk | %s |\n' "$SKIP_RISK"
            printf '| Pipeline | %s |\n' "$PIPELINE_STATUS"
            echo
            echo "Intraday prices run in the independent Intraday Market Data workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify required result
        if: always()
        env:
          PIPELINE_STATUS: ${{ steps.pipeline.outputs.status }}
        run: |
          if [ -z "$PIPELINE_STATUS" ] || [ "$PIPELINE_STATUS" = "failed" ]; then
            echo "::error::The protected ingestion pipeline did not complete"
            exit 1
          fi