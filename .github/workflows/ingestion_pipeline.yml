name: Ingestion Pipeline

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      skip_ai:
        description: 'Skip AI enrichment'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      skip_risk:
        description: 'Skip risk scoring'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# The direct runner invokes the protected application handler in this process.
# PostgreSQL owns overlap prevention; no public HTTP request crosses Cloudflare.
jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INTERNAL_RUNNER_TOKEN: ${{ secrets.INTERNAL_RUNNER_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SKIP_AI: ${{ github.event.inputs.skip_ai || 'false' }}
      SKIP_RISK: ${{ github.event.inputs.skip_risk || 'false' }}
      PYTHONPATH: '.'
      SKIP_MIGRATIONS: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingestion pipeline directly
        id: pipeline
        run: |
          set -o pipefail
          python scripts/replit_scheduled_job.py --job ingestion \
            2>&1 | tee ingestion_output.txt

      - name: Upload logs
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: ingestion-logs-${{ github.run_id }}
          path: ingestion_output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: always()
        env:
          PIPELINE_STATUS: ${{ steps.pipeline.outcome }}
          TRIGGER_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## Ingestion Pipeline Run Summary"
            echo
            echo "| Setting | Value |"
            echo "|---|---|"
            printf '| Trigger | %s |\n' "$TRIGGER_NAME"
            printf '| Skip AI | %s |\n' "$SKIP_AI"
            printf '| Skip risk | %s |\n' "$SKIP_RISK"
            printf '| Pipeline | %s |\n' "$PIPELINE_STATUS"
            echo
            echo "The application handler ran directly; no public HTTP timeout applies."
          } >> "$GITHUB_STEP_SUMMARY"