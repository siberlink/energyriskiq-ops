name: Alerts Engine v2

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to execute (a=generate, b=fanout, c=send, d=digests, all=A→B→D→C)'
        required: false
        default: 'all'
        type: choice
        options: [all, a, b, c, d]
      dry_run:
        description: 'Dry run mode (no DB changes or messages sent)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      since_hours:
        description: 'Lookback hours for Phase B'
        required: false
        default: '24'
      batch_size:
        description: 'Batch size for Phase C'
        required: false
        default: '200'
      skip_preflight:
        description: 'Skip preflight check'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      alerts_enabled:
        description: 'Enable Alerts v2 (set to false to skip)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      include_pro_delivery:
        description: 'Run Pro Plan delivery after alerts'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      include_trader_delivery:
        description: 'Run Trader Plan delivery after alerts'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

# The direct runner invokes the protected handlers in this process. PostgreSQL
# owns overlap prevention; no public HTTP request crosses Cloudflare.
jobs:
  run-alerts-engine-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INTERNAL_RUNNER_TOKEN: ${{ secrets.INTERNAL_RUNNER_TOKEN }}
      ALERTS_V2_ENABLED: ${{ github.event.inputs.alerts_enabled || 'true' }}
      ALERTS_ENABLED: ${{ github.event.inputs.alerts_enabled || 'true' }}
      PHASE: ${{ github.event.inputs.phase || 'all' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      SINCE_HOURS: ${{ github.event.inputs.since_hours || '24' }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '200' }}
      SKIP_PREFLIGHT: ${{ github.event.inputs.skip_preflight || 'false' }}
      INCLUDE_PRO_DELIVERY: ${{ github.event.inputs.include_pro_delivery || 'true' }}
      INCLUDE_TRADER_DELIVERY: ${{ github.event.inputs.include_trader_delivery || 'true' }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
      ALERTS_SEND_ALLOWLIST_USER_IDS: ${{ secrets.ALERTS_SEND_ALLOWLIST_USER_IDS }}
      ALERTS_MAX_SEND_PER_RUN: ${{ secrets.ALERTS_MAX_SEND_PER_RUN || '1000' }}
      GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
      PYTHONPATH: '.'
      SKIP_MIGRATIONS: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alerts Engine and deliveries directly
        id: alerts
        run: |
          set -o pipefail
          python scripts/replit_scheduled_job.py --job alerts \
            2>&1 | tee alerts_engine_output.txt

      - name: Upload logs
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: alerts-engine-logs-${{ github.run_id }}
          path: alerts_engine_output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: always()
        env:
          ALERTS_STATUS: ${{ steps.alerts.outcome }}
          TRIGGER_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## Alerts Engine v2 Run Summary"
            echo
            echo "| Item | Result |"
            echo "|---|---|"
            printf '| Trigger | %s |\n' "$TRIGGER_NAME"
            printf '| Phase | %s |\n' "$PHASE"
            printf '| Dry run | %s |\n' "$DRY_RUN"
            printf '| Alerts and deliveries | %s |\n' "$ALERTS_STATUS"
            echo
            echo "The application handlers ran directly; no public HTTP timeout applies."
          } >> "$GITHUB_STEP_SUMMARY"