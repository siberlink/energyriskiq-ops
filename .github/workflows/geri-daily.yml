name: Daily Index Computation (GERI + EERI + EGSI)

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      include_delivery:
        description: 'Deliver the completed indices and digest'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

# The direct runner owns the complete ordered sequence under one PostgreSQL lock.
jobs:
  compute-indices:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INTERNAL_RUNNER_TOKEN: ${{ secrets.INTERNAL_RUNNER_TOKEN }}
      INCLUDE_DELIVERY: ${{ github.event.inputs.include_delivery || 'true' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GIE_API_KEY: ${{ secrets.GIE_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      PYTHONPATH: '.'
      SKIP_MIGRATIONS: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily index pipeline directly
        id: daily
        run: |
          set -o pipefail
          python scripts/replit_scheduled_job.py --job daily \
            2>&1 | tee daily_output.txt

      - name: Upload logs
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: daily-index-logs-${{ github.run_id }}
          path: daily_output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: always()
        env:
          DAILY_STATUS: ${{ steps.daily.outcome }}
          TRIGGER_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## Daily Index Computation Summary"
            echo
            echo "| Item | Result |"
            echo "|---|---|"
            printf '| Trigger | %s |\n' "$TRIGGER_NAME"
            printf '| Include delivery | %s |\n' "$INCLUDE_DELIVERY"
            printf '| Daily pipeline | %s |\n' "$DAILY_STATUS"
            echo
            echo "The application handler ran directly; no public HTTP timeout applies."
          } >> "$GITHUB_STEP_SUMMARY"