name: Alert Metadata Backfill

on:
  schedule:
    - cron: '16 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report updates without changing data'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# The direct runner invokes the protected handler under its PostgreSQL lock.
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INTERNAL_RUNNER_TOKEN: ${{ secrets.INTERNAL_RUNNER_TOKEN }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      PYTHONPATH: '.'
      SKIP_MIGRATIONS: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill Alert Metadata directly
        id: backfill
        run: |
          set -o pipefail
          python scripts/replit_scheduled_job.py --job metadata \
            2>&1 | tee backfill_output.txt

      - name: Upload logs
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: alert-metadata-backfill-${{ github.run_id }}
          path: backfill_output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: always()
        env:
          BACKFILL_STATUS: ${{ steps.backfill.outcome }}
          TRIGGER_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## Alert Metadata Backfill Summary"
            echo
            echo "| Item | Result |"
            echo "|---|---|"
            printf '| Trigger | %s |\n' "$TRIGGER_NAME"
            printf '| Dry run | %s |\n' "$DRY_RUN"
            printf '| Backfill | %s |\n' "$BACKFILL_STATUS"
            echo
            echo "The application handler ran directly; no public HTTP timeout applies."
          } >> "$GITHUB_STEP_SUMMARY"