name: SEO Daily Page Generator

on:
  schedule:
    # Off-peak generation plus independent retries if GitHub delays/drops a run.
    - cron: '17 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date (YYYY-MM-DD) or leave empty for yesterday'
        required: false
        type: string
      dry_run:
        description: 'Dry run (preview only)'
        required: false
        type: boolean
        default: false
      backfill:
        description: 'Backfill N days'
        required: false
        type: number

concurrency:
  group: seo-public-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-seo-pages:
    runs-on: ubuntu-latest
    
    timeout-minutes: 150
    steps:
      - name: Generate and verify public digest pages
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SEO_RUNNER_TOKEN: ${{ secrets.SEO_RUNNER_TOKEN }}
          TARGET_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
          BACKFILL: ${{ inputs.backfill }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import subprocess
          import urllib.parse
          from html.parser import HTMLParser

          class CanonicalParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "link" and attrs.get("rel") == "canonical":
                      self.urls.append(attrs.get("href", ""))

          def published(url, day):
              path = "/daily-geo-energy-intelligence-digest/" + day.isoformat()
              try:
                  result = subprocess.run(
                      ["curl", "--silent", "--show-error", "--max-time", "25",
                       "--write-out", "\n%{http_code}", url + path],
                      capture_output=True, text=True, timeout=30)
              except subprocess.TimeoutExpired:
                  raise SystemExit("Digest availability check timed out.")
              body, _, status = result.stdout.rpartition("\n")
              if result.returncode:
                  raise SystemExit("Digest availability transport failed.")
              if status in ("404", "302"):
                  return False
              if status != "200":
                  raise SystemExit(f"Digest availability rejected: HTTP {status}.")
              parser = CanonicalParser()
              parser.feed(body)
              if not any(urllib.parse.urlparse(href).path == path for href in parser.urls):
                  raise SystemExit("Digest availability did not return the requested dated page.")
              return True

          url = os.environ.get("APP_URL", "").rstrip("/")
          token = os.environ.get("SEO_RUNNER_TOKEN", "")
          if not url.startswith("https://") or not token:
              raise SystemExit("APP_URL or dedicated SEO credential is not configured.")
          yesterday = dt.datetime.now(dt.timezone.utc).date() - dt.timedelta(days=1)
          supplied = os.environ.get("TARGET_DATE", "")
          count = int(os.environ.get("BACKFILL") or 0)
          if supplied and count:
              raise SystemExit("Choose a date OR a backfill range, not both.")
          if not 0 <= count <= 90:
              raise SystemExit("Backfill must be between 1 and 90.")
          scheduled = os.environ.get("EVENT_NAME") == "schedule"
          targets = ([dt.date.fromisoformat(supplied)] if supplied else
                     [yesterday - dt.timedelta(days=i) for i in range(count or (3 if scheduled else 1))])
          if any(day > yesterday for day in targets):
              raise SystemExit("Only completed UTC dates can be generated.")
          dry = os.environ.get("DRY_RUN") == "true"
          for day in sorted(targets):
              if scheduled and not dry and published(url, day):
                  print(f"Public digest {day.isoformat()}: already published; skipped.")
                  continue
              query = urllib.parse.urlencode({"date": day.isoformat(),
                                               "dry_run": str(dry).lower()})
              # Keep the original curl transport, which is accepted by the site's
              # edge protection; Python urllib requests can receive an HTML 403.
              try:
                  result = subprocess.run(
                      ["curl", "--silent", "--show-error", "--max-time", "90",
                       "--request", "POST", "--header", "x-internal-token: " + token,
                       "--header", "Content-Type: application/json",
                       "--write-out", "\n%{http_code}",
                       url + "/internal/run/seo?" + query],
                      capture_output=True, text=True, timeout=95)
              except subprocess.TimeoutExpired:
                  raise SystemExit("Digest generation request timed out.")
              body, _, status = result.stdout.rpartition("\n")
              if result.returncode:
                  raise SystemExit(f"Digest request transport failed (code {result.returncode}).")
              if status != "200":
                  raise SystemExit(f"Digest generation rejected: HTTP {status}.")
              try:
                  payload = json.loads(body)
              except ValueError:
                  raise SystemExit("Generation did not return valid successful JSON.")
              digest = next((item for item in payload.get("digest_pages", [])
                             if item.get("date") == day.isoformat()), None)
              if not digest or digest.get("error") or (not dry and not digest.get("page_id")):
                  raise SystemExit(f"Public digest {day.isoformat()} was not confirmed saved.")
              if dry and digest.get("dry_run") is not True:
                  raise SystemExit("The public digest preview was not confirmed.")
              print(f"Public digest {day.isoformat()}: {'previewed' if dry else 'saved'}.")
          PY
          
      - name: Summary
        run: |
          echo "## SEO Generator Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Date | ${{ inputs.date || 'yesterday' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry Run | ${{ inputs.dry_run || false }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
