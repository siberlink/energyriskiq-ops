name: Intraday Market Data Capture

on:
  schedule:
    - cron: '*/40 * * * *'
  workflow_dispatch:

# PostgreSQL owns overlap prevention. Avoid a GitHub concurrency group that can
# replace an older pending schedule event.
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INTERNAL_RUNNER_TOKEN: ${{ secrets.INTERNAL_RUNNER_TOKEN }}
      PYTHONPATH: '.'
      SKIP_MIGRATIONS: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Capture intraday prices directly
        id: capture
        run: |
          set -o pipefail
          python scripts/replit_scheduled_job.py --job intraday \
            2>&1 | tee intraday_prices_output.txt

      - name: Upload capture log
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: intraday-market-data-${{ github.run_id }}
          path: intraday_prices_output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Summary
        if: always()
        env:
          CAPTURE_STATUS: ${{ steps.capture.outcome }}
          TRIGGER_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## Intraday Market Data"
            echo
            printf -- '- Trigger: %s\n' "$TRIGGER_NAME"
            printf -- '- Capture: %s\n' "$CAPTURE_STATUS"
            echo
            echo "The application handler ran directly; no public HTTP timeout applies."
          } >> "$GITHUB_STEP_SUMMARY"
